---
site:
  title: OpenShift Troubleshooting Workshop
  url: https://github.com/finhennessy/workshops
  start_page: openshift-troubleshooting-workshop::index.adoc
  keys:
    navbar_logo: openshift  

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/finhennessy/showroom_theme/releases/download/v0.1.0/ui-bundle.zip
    snapshot: true
  supplemental_files:
    - path: ./content/supplemental-ui
    - path: ./content/lib
    - path: .nojekyll
    - path: ui.yml
      contents: "static_files: [ .nojekyll ]"

runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www

# Module attributes for ifeval conditionals in nav.adoc
# In production, these are injected by the showroom workload via user_data
# For local preview, enable all modules by setting to "true"
asciidoc:
  attributes:
    toclevels: 2
    # Module flags - matches catalog parameter names (module_enable_*)
    # Getting Started
    module_enable_install: 'true'
    # Core Operations
    module_enable_appmgmt: 'false'
    module_enable_ingress: 'true'
    module_enable_netsec: 'true'
    module_enable_debugging: 'true'
    module_enable_gitops: 'false'
    # Identity & Access
    module_enable_ldap: 'false'
    module_enable_oidc: 'false'
    # Day 2 Operations
    module_enable_observability: 'true'
    module_enable_performance: 'true'
    # Advanced Topics
    module_enable_virt: 'false'
    module_enable_devhub: 'false'
    module_enable_ols: 'false'
    module_enable_acm: 'false'
    module_enable_security: 'false'
    module_enable_ztwim: 'false'
    module_enable_vault: 'false'
    # Console details
    openshift_cluster_admin_username: 'admin'
    openshift_cluster_admin_password: 'aWq9i2pBYneKpv6o'
    openshift_cluster_console_url: 'https://console-openshift-console.apps.workshop.sandbox3998.opentlc.com'
